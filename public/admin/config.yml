backend:
  name: github
  repo: Soulmarket-com/tolen
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

publish_mode: simple
media_folder: ""
public_folder: ""

collections:
  - name: "events"
    label: "Eventos"
    folder: "src/content/events"
    create: true
    delete: true
    identifier_field: titulo
    slug: "{{slug}}"
    summary: "{{titulo}} — {{fields.publicado}}"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - label: "Fecha"
        name: "fecha"
        widget: "object"
        fields:
          - { label: "Día", name: "dia", widget: "number", value_type: "int", min: 1, max: 31 }
          - { label: "Mes", name: "mes", widget: "number", value_type: "int", min: 1, max: 12 }
          - { label: "Año", name: "anio", widget: "number", value_type: "int", min: 2024, max: 2100 }
      - { label: "Descripción", name: "descripcion", widget: "text" }
      - { label: "Imagen", name: "imagen", widget: "image", media_folder: "", public_folder: "" }
      - { label: "Lugar", name: "lugar", widget: "string", required: false }
      - label: "Precio"
        name: "precio"
        widget: "string"
        required: false
        hint: 'Ej. "Gratuito" o "10€"'
      - label: "Aforo"
        name: "aforo"
        widget: "number"
        value_type: "int"
        required: false
        hint: "Número máximo de plazas (déjalo vacío si no aplica)"
      - label: "Rango de edad"
        name: "rango_edad"
        widget: "string"
        required: false
        hint: 'Ej. "3-6 años" o "Todos los públicos"'
      - { label: "Publicado", name: "publicado", widget: "boolean", default: true }
